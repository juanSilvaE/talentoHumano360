<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humano 360 — Gobernación de Boyacá</title>
  <meta name="description" content="Sistema de Gestión de Talento Humano — Gobernación de Boyacá. Administre servidores públicos, solicitudes de vacaciones, permisos, incapacidades, licencias y viáticos." />
  <meta name="theme-color" content="#1a3a6b" />

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!-- ─── Login Screen ─────────────────────────────────────────────────── -->
  <div id="login-screen" class="login-screen" role="main">
    <div class="login-bg">
      <div class="login-orb login-orb--1"></div>
      <div class="login-orb login-orb--2"></div>
      <div class="login-orb login-orb--3"></div>
    </div>
    <div class="login-card glass">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="url(#lg1)" stroke="rgba(200,166,61,0.4)" stroke-width="2"/>
            <path d="M14 30c0-5.5 4.5-10 10-10s10 4.5 10 10" stroke="#c8a63d" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="18" r="5" fill="#c8a63d"/>
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="48" y2="48">
                <stop offset="0%" stop-color="#1a3a6b"/>
                <stop offset="100%" stop-color="#0f1b2d"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="login-brand">
          <h1 class="login-title">Humano <span>360</span></h1>
          <p class="login-subtitle">Gobernación de Boyacá</p>
          <p class="login-subtitle">Sistema de Gestión de Talento Humano</p>
        </div>
      </div>

      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="login-username" class="form-label">Usuario</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login-username" class="form-input" placeholder="Ingresa tu usuario" required autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label for="login-password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="login-password" class="form-input" placeholder="Ingresa tu contraseña" required autocomplete="current-password" />
            <button type="button" id="toggle-password" class="input-toggle" aria-label="Mostrar/ocultar contraseña">
              <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="form-error" role="alert" aria-live="polite"></div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-full">
          <span class="btn-text">Ingresar al Sistema</span>
          <span class="btn-loader" style="display:none">
            <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            Ingresando...
          </span>
        </button>
      </form>

      <p class="login-footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Acceso restringido — Sistema Institucional
      </p>
    </div>
  </div>

  <!-- ─── Main App ──────────────────────────────────────────────────────── -->
  <div id="app" class="app" style="display:none" role="application">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Menú principal">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="url(#slg)"/>
            <path d="M11 25c0-4.5 4-8 9-8s9 3.5 9 8" stroke="#c8a63d" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="15" r="4" fill="#c8a63d"/>
            <defs><linearGradient id="slg" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#1e4a8a"/><stop offset="100%" stop-color="#0f1b2d"/></linearGradient></defs>
          </svg>
        </div>
        <div class="sidebar-brand">
          <span class="sidebar-title">Humano <span>360</span></span>
          <span class="sidebar-dept">Talento Humano</span>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Colapsar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul role="list">
          <li>
            <button class="nav-item active" data-module="dashboard" id="nav-dashboard" aria-current="page">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span class="nav-label">Dashboard</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-module="employees" id="nav-employees">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span class="nav-label">Servidores</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-module="requests" id="nav-requests">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span class="nav-label">Vacaciones</span>
            </button>
          </li>
          <li class="nav-group">
            <button class="nav-item nav-group-toggle" id="nav-admin-group" aria-expanded="false" aria-controls="admin-submenu">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <span class="nav-label">Solicitudes Admin</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <ul id="admin-submenu" class="nav-submenu" aria-hidden="true" role="list">
              <li>
                <button class="nav-item nav-subitem" data-module="admin-requests" data-tipo="Permiso Laboral" id="nav-permisos">
                  <svg class="nav-icon nav-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span class="nav-label">Permisos Laborales</span>
                </button>
              </li>
              <li>
                <button class="nav-item nav-subitem" data-module="admin-requests" data-tipo="Incapacidad" id="nav-incapacidades">
                  <svg class="nav-icon nav-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                  <span class="nav-label">Incapacidades</span>
                </button>
              </li>
              <li>
                <button class="nav-item nav-subitem" data-module="admin-requests" data-tipo="Licencia" id="nav-licencias">
                  <svg class="nav-icon nav-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  <span class="nav-label">Licencias</span>
                </button>
              </li>
            </ul>
          </li>
          <li>
            <button class="nav-item" data-module="viaticos" id="nav-viaticos">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <span class="nav-label">Viáticos</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar-user">
        <div class="user-avatar" id="user-avatar" aria-hidden="true">A</div>
        <div class="user-info">
          <span class="user-name" id="user-name">Administrador</span>
          <span class="user-role" id="user-role">Sistema</span>
        </div>
        <button id="logout-btn" class="logout-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content" role="main">
      <!-- Topbar -->
      <header class="topbar" role="banner">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-breadcrumb">
          <span id="page-title">Dashboard</span>
        </div>
        <div class="topbar-actions">
          <span class="topbar-date" id="topbar-date"></span>
          <span class="topbar-badge" id="topbar-role-badge">Admin</span>
        </div>
      </header>

      <!-- Module Container -->
      <div id="module-container" class="module-container">
        <!-- Modules injected here by JS -->
      </div>
    </main>
  </div>

  <!-- ─── Global Toast ─────────────────────────────────────────────────── -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ─── Global Modal ─────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" style="display:none">
    <div class="modal-box glass">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close" class="modal-close" aria-label="Cerrar modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- ─── Scripts ──────────────────────────────────────────────────────── -->
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/employees.js"></script>
  <script src="js/modules/requests.js"></script>
  <script src="js/modules/admin-requests.js"></script>
  <script src="js/modules/viaticos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
