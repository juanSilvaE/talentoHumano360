services:
  # ─────────────────────────────────────────────────
  # DATABASE
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: humano360_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talento360}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
      - ./database/03_new_modules.sql:/docker-entrypoint-initdb.d/03_new_modules.sql
    ports:
      - "5432:5432"
    networks:
      - humano360_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  # MICROSERVICE 2 — Auth Service
  # ─────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: humano360_auth
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 3 — Employees Service
  # ─────────────────────────────────────────────────
  employees-service:
    build: ./services/employees-service
    container_name: humano360_employees
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 4 — Requests Service (Vacaciones)
  # ─────────────────────────────────────────────────
  requests-service:
    build: ./services/requests-service
    container_name: humano360_requests
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 5 — Admin Requests Service
  # ─────────────────────────────────────────────────
  admin-requests-service:
    build: ./services/admin-requests-service
    container_name: humano360_admin_requests
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 6 — Viáticos Service
  # ─────────────────────────────────────────────────
  viaticos-service:
    build: ./services/viaticos-service
    container_name: humano360_viaticos
    restart: unless-stopped
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # MICROSERVICE 7 — Dashboard Service
  # ─────────────────────────────────────────────────
  dashboard-service:
    build: ./services/dashboard-service
    container_name: humano360_dashboard
    restart: unless-stopped
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-talento360}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-humano360_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humano360_net

  # ─────────────────────────────────────────────────
  # FRONTEND + GATEWAY (Nginx)
  # ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: humano360_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - employees-service
      - requests-service
      - admin-requests-service
      - viaticos-service
      - dashboard-service
    networks:
      - humano360_net

volumes:
  postgres_data:

networks:
  humano360_net:
    driver: bridge
